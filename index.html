<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инновационный Центр Безопасности</title>
    <style>
        /* Базовые настройки и ТЁМНАЯ ТЕМА */
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #ff5722; /* Оранжевый акцент с визитки */
            --section-bg: #1e1e1e;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Контейнер для центрирования контента */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Шапка сайта */
        header {
            background-color: var(--section-bg);
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Выворотка логотипа с помощью CSS (инвертирует цвета) */
        .logo img {
            max-height: 60px;
            filter: invert(1) brightness(1.5); 
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* Главный экран (Hero) */
        .hero {
            padding: 100px 0;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 40px auto;
            color: #b0b0b0;
        }

        .btn {
            background-color: var(--accent-color);
            color: #fff;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #e64a19;
        }

        /* Секция услуг */
        .services {
            background-color: var(--section-bg);
            padding: 80px 0;
        }

        .services h2 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 50px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background-color: var(--bg-color);
            padding: 30px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .service-card h3 {
            margin-top: 0;
            color: #fff;
        }

        /* Контакты и Футер */
        footer {
            padding: 60px 0;
            background-color: #0a0a0a;
            text-align: center;
        }

        .contact-info {
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .contact-info a {
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-inner">
            <div class="logo">
                <a href="#"><img src="logo.png" alt="ИЦБ Логотип"></a>
            </div>
            <nav>
                <a
